name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix poc ci
      - run: npm run smoke:frontend

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix poc ci
      - run: npm run build
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix poc ci
      - run: npx playwright install chromium --with-deps
      - run: npm run smoke:e2e

  backend-check:
    runs-on: ubuntu-latest
    needs: frontend-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - run: npm run check:functions
      # check:server cubre los handlers del runtime Deno standalone que sirve
      # demo (deploy/server/api/*). Sin este step, gaps como el de Fase 9
      # (rutas teams) llegan a producción aunque check:functions pase.
      - run: npm run check:server

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-check
    services:
      supabase:
        image: supabase/postgres:15.8.1.091
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: echo "SUPABASE_URL=http://127.0.0.1:54321" >> .env
      - run: echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
      - run: npm run db:start || true
      - run: npm run db:reset || true
      - run: npm run smoke:backend || true
        env:
          AUTHENTIK_ISSUER: ${{ secrets.AUTHENTIK_ISSUER }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}

  docker-image:
    runs-on: ubuntu-latest
    needs: [frontend-build, e2e, backend-check, backend-integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}

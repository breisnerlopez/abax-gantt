services:
  abax-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      AUTHENTIK_JWKS_URL: ${AUTHENTIK_JWKS_URL}
      STORAGE_PATH: /app/data/attachments
      ADMIN_GROUP: ${ADMIN_GROUP:-abax-admins}
      AUTH_MODE: external
      PUBLIC_AUTHENTIK_AUTHORITY: ${PUBLIC_AUTHENTIK_AUTHORITY:-${AUTHENTIK_ISSUER}}
      PUBLIC_AUTHENTIK_CLIENT_ID: ${PUBLIC_AUTHENTIK_CLIENT_ID:-${AUTHENTIK_CLIENT_ID:-abax-gantt-spa}}
      PUBLIC_AUTHENTIK_REDIRECT_URI: ${PUBLIC_AUTHENTIK_REDIRECT_URI:-http://localhost:8000/auth/callback}
      PUBLIC_AUTHENTIK_POST_LOGOUT_REDIRECT_URI: ${PUBLIC_AUTHENTIK_POST_LOGOUT_REDIRECT_URI:-http://localhost:8000/login}
      PUBLIC_BASE_PATH: ${PUBLIC_BASE_PATH:-/}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - attachments:/app/data/attachments
    restart: unless-stopped

volumes:
  attachments:

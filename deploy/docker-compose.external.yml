services:
  abax-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_AUTHENTIK_AUTHORITY: ${VITE_AUTHENTIK_AUTHORITY:-${AUTHENTIK_ISSUER}}
        VITE_AUTHENTIK_CLIENT_ID: ${VITE_AUTHENTIK_CLIENT_ID:-${AUTHENTIK_CLIENT_ID:-abax-gantt-spa}}
        VITE_AUTHENTIK_REDIRECT_URI: ${VITE_AUTHENTIK_REDIRECT_URI:-http://localhost:8000/auth/callback}
        VITE_AUTHENTIK_POST_LOGOUT_REDIRECT_URI: ${VITE_AUTHENTIK_POST_LOGOUT_REDIRECT_URI:-http://localhost:8000/login}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      AUTHENTIK_JWKS_URL: ${AUTHENTIK_JWKS_URL}
      STORAGE_PATH: /app/data/attachments
      ADMIN_GROUP: ${ADMIN_GROUP:-abax-admins}
      AUTH_MODE: external
    ports:
      - "8000:8000"
    volumes:
      - attachments:/app/data/attachments
    restart: unless-stopped

volumes:
  attachments:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: abax
      POSTGRES_PASSWORD: ${DB_PASSWORD:-abax_secret}
      POSTGRES_DB: abax
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abax"]
      interval: 5s
    restart: unless-stopped

  authentik-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: abax
      POSTGRES_PASSWORD: ${DB_PASSWORD:-abax_secret}
      POSTGRES_DB: authentik
    volumes:
      - authpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abax"]
      interval: 5s
    restart: unless-stopped

  authentik-redis:
    image: redis:7-alpine
    restart: unless-stopped

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-generate-real-secret}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: abax
      AUTHENTIK_POSTGRESQL__PASSWORD: ${DB_PASSWORD:-abax_secret}
      AUTHENTIK_REDIS__HOST: authentik-redis
    volumes:
      - media:/media
      - custom-templates:/templates
    ports:
      - "9000:9000"
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-generate-real-secret}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: abax
      AUTHENTIK_POSTGRESQL__PASSWORD: ${DB_PASSWORD:-abax_secret}
      AUTHENTIK_REDIS__HOST: authentik-redis
    volumes:
      - media:/media
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    restart: unless-stopped

  abax-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_AUTHENTIK_AUTHORITY: ${VITE_AUTHENTIK_AUTHORITY:-http://localhost:9000/application/o/abax-gantt/}
        VITE_AUTHENTIK_CLIENT_ID: ${VITE_AUTHENTIK_CLIENT_ID:-${AUTHENTIK_CLIENT_ID:-abax-gantt-spa}}
        VITE_AUTHENTIK_REDIRECT_URI: ${VITE_AUTHENTIK_REDIRECT_URI:-http://localhost:8000/auth/callback}
        VITE_AUTHENTIK_POST_LOGOUT_REDIRECT_URI: ${VITE_AUTHENTIK_POST_LOGOUT_REDIRECT_URI:-http://localhost:8000/login}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    environment:
      DATABASE_URL: postgresql://abax:${DB_PASSWORD:-abax_secret}@postgres:5432/abax
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-http://localhost:9000/application/o/abax-gantt/}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-abax-gantt-spa}
      AUTHENTIK_JWKS_URL: ${AUTHENTIK_JWKS_URL:-http://authentik-server:9000/application/o/abax-gantt/jwks/}
      STORAGE_PATH: /app/data/attachments
      ADMIN_GROUP: ${ADMIN_GROUP:-abax-admins}
      AUTH_MODE: bundled
    ports:
      - "8000:8000"
    volumes:
      - attachments:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  authpgdata:
  media:
  custom-templates:
  attachments:

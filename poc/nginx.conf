server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /gantt {
        return 301 /gantt/;
    }

    location /gantt/ {
        try_files $uri $uri/ /gantt/index.html;
    }

    location /gantt/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

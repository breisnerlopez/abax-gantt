<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP vive en headers HTTP en deploy/server.ts (frame-ancestors no funciona en meta). -->
    <meta name="description" content="ABAX Gantt — Gestor de proyectos con WBS y Gantt" />
    <meta name="theme-color" content="#4f5bd5" />
    <link rel="manifest" href="./manifest.json" />
    <title>ABAX Gantt</title>
    <link rel="preload" href="./fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/Inter-600.woff2" as="font" type="font/woff2" crossorigin />
    <script src="./config.js"></script>
    <script>
      document.documentElement.setAttribute('data-theme', localStorage.getItem('abax.theme') || 'dark');
    </script>
    <script>
      // SW lifecycle:
      // - register() y luego registration.update() en cada load → fuerza a Chrome
      //   a re-fetchear sw.js incluso si el browser hubiera cacheado el registro.
      // - 'updatefound' + statechange 'installed' → si hay SW antiguo controlando,
      //   llamamos skipWaiting via postMessage para que active el nuevo de inmediato.
      // - controllerchange → recargamos una vez para que la página corra contra el
      //   nuevo SW (que sirve el bundle nuevo). Sin esto, el user tendría que
      //   refrescar dos veces tras un deploy.
      if ('serviceWorker' in navigator) {
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
        window.addEventListener('load', () => {
          const base = window.__ABAX_CONFIG__?.publicBasePath || '/';
          const swUrl = `${base.endsWith('/') ? base : `${base}/`}sw.js`;
          navigator.serviceWorker.register(swUrl).then((registration) => {
            registration.update().catch(() => {});
            registration.addEventListener('updatefound', () => {
              const next = registration.installing;
              if (!next) return;
              next.addEventListener('statechange', () => {
                if (next.state === 'installed' && navigator.serviceWorker.controller) {
                  next.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          }).catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

services:
  authentik-test-server:
    image: ghcr.io/goauthentik/server:2025.10
    container_name: authentik-test-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: "<generate-secure-secret-key>"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "<bootstrappassword>"
      AUTHENTIK_BOOTSTRAP_EMAIL: "admin@qa-test.local"
      AUTHENTIK_BOOTSTRAP_TOKEN: "<bootstrap-token>"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes:
      - authentik-test-media:/media
    networks:
      - authentik-qa
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/-/health/ready/"]
      interval: 10s
      timeout: 5s
      retries: 10

  authentik-test-worker:
    image: ghcr.io/goauthentik/server:2025.10
    container_name: authentik-test-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: "<generate-secure-secret-key>"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik-test-media:/media
    networks:
      - authentik-qa
    depends_on:
      authentik-test-server:
        condition: service_healthy

networks:
  authentik-qa:
    name: authentik-qa

volumes:
  authentik-test-media:
